# Baseline inference configuration. Experiment files override individual keys.

model_id: stable-diffusion-v1-5/stable-diffusion-v1-5
device: auto            # auto | cuda | mps | cpu
dtype: fp32             # fp32 | fp16

scheduler: pndm         # pndm (SD1.5 default) | ddim | dpmpp_2m | euler | euler_a
num_inference_steps: 50
guidance_scale: 7.5
height: 512
width: 512

deepcache:
  enabled: false
  cache_interval: 3     # full UNet pass every N steps
  cache_branch_id: 0    # which skip branch to cache (0 = shallowest, fastest)

prompts_file: data/prompts/eval_prompts.jsonl
num_prompts: null       # null = all prompts
batch_size: 1           # 1 for latency; >1 for throughput runs
warmup_batches: 2       # excluded from timing

output_root: results
save_images: true
